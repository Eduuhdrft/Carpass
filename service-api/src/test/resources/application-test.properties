# =============================================================================
# Perfil usado pelos testes automatizados.
#
# Banco em memoria e schema gerado pelo Hibernate: os testes nao dependem de um
# Postgres rodando na maquina e nao tocam em nenhum dado real.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:carpass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

carpass.security.jwt-secret=segredo-apenas-para-testes-com-tamanho-suficiente-1234567890
carpass.security.allowed-origins=http://localhost:4200
carpass.mail.enabled=false

logging.level.com.carpass=WARN
