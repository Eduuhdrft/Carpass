spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.carpass=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Deixa o link de redefinicao de senha visivel no log em vez de enviar e-mail.
carpass.mail.enabled=false
