# =============================================================================
# CarPass - configuracao base da API
#
# Nenhum segredo fica neste arquivo. Tudo que e sensivel vem de variavel de
# ambiente. Veja .env.example para a lista completa e como preencher.
# =============================================================================
spring.application.name=service-api
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# ------------------------------------------------------------------- banco
spring.datasource.url=${CARPASS_DB_URL:jdbc:postgresql://localhost:5432/carpass}
spring.datasource.username=${CARPASS_DB_USERNAME:postgres}
spring.datasource.password=${CARPASS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema e controlado por migrations do Flyway. O Hibernate apenas confere se
# o mapeamento das entidades bate com as tabelas existentes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.docker.compose.enabled=false

# -------------------------------------------------------------- seguranca
carpass.security.jwt-secret=${CARPASS_JWT_SECRET:}
carpass.security.jwt-expiration-seconds=${CARPASS_JWT_EXPIRATION_SECONDS:28800}
carpass.security.allowed-origins=${CARPASS_ALLOWED_ORIGINS:http://localhost:4200}
carpass.security.frontend-base-url=${CARPASS_FRONTEND_URL:http://localhost:4200}
carpass.security.password-reset-token-minutes=${CARPASS_PASSWORD_RESET_MINUTES:30}
# Validade do link com que o cliente aprova ou recusa o orcamento. Curto de
# proposito: e um link sem senha, que decide dinheiro.
carpass.quote.approval-token-hours=${CARPASS_QUOTE_TOKEN_HOURS:24}

# ---------------------------------------------------------------- integracoes
# Servicos publicos e gratuitos, sem chave. Ficam em configuracao mesmo assim:
# no dia em que um sair do ar ou mudar de dominio, trocar a variavel e mais
# rapido que publicar uma versao.
carpass.integration.cep-primary-url=${CARPASS_CEP_URL:https://brasilapi.com.br/api/cep/v2}
carpass.integration.cep-fallback-url=${CARPASS_CEP_FALLBACK_URL:https://viacep.com.br/ws}
carpass.integration.fipe-url=${CARPASS_FIPE_URL:https://parallelum.com.br/fipe/api/v1}
# Curto de proposito: alguem esta esperando olhando para um formulario.
carpass.integration.timeout=${CARPASS_INTEGRATION_TIMEOUT:4s}
carpass.integration.cache-ttl=${CARPASS_INTEGRATION_CACHE_TTL:12h}
carpass.integration.cache-max-entries=${CARPASS_INTEGRATION_CACHE_MAX:2000}

# ------------------------------------------------------------------ e-mail
# Com carpass.mail.enabled=false os e-mails apenas aparecem no log, o que
# permite desenvolver sem nenhum servidor SMTP configurado. Para enviar de
# verdade: CARPASS_MAIL_ENABLED=true e as credenciais SMTP preenchidas.
carpass.mail.enabled=${CARPASS_MAIL_ENABLED:false}
# O remetente cai para a propria conta SMTP quando nao e informado. Provedores
# como o Gmail recusam ou reescrevem um From que nao seja a conta autenticada,
# entao um valor fixo de fantasia faria o envio falhar em vez de chegar.
carpass.mail.from=${CARPASS_MAIL_FROM:${CARPASS_MAIL_USERNAME:nao-responda@carpass.app}}
spring.mail.host=${CARPASS_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${CARPASS_MAIL_PORT:587}
spring.mail.username=${CARPASS_MAIL_USERNAME:}
spring.mail.password=${CARPASS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------- erros
# O cliente nunca deve receber stack trace nem mensagem interna.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.web.resources.add-mappings=false
# Rota inexistente vira NoHandlerFoundException e e tratada pelo nosso handler,
# devolvendo o mesmo formato de erro do resto da API.
spring.mvc.throw-exception-if-no-handler-found=true

# ---------------------------------------------------------------- monitoria
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# O health check de e-mail acompanha a flag de envio: sem SMTP configurado ele
# so produziria ruido de falha de autenticacao no log.
management.health.mail.enabled=${CARPASS_MAIL_ENABLED:false}

# ------------------------------------------------------------------- logs
logging.level.com.carpass=INFO
